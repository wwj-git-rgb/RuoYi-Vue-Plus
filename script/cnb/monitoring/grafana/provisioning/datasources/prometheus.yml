# Grafana 数据源配置
# 自动配置 Prometheus 数据源

apiVersion: 1

datasources:
  # Prometheus 主数据源
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: 2.40.0
      cacheLevel: 'High'
      disableRecordingRules: false
      incrementalQueryOverlapWindow: 10m
      queryTimeout: 60s
      timeInterval: 15s
    secureJsonData: {}
    version: 1
    uid: prometheus-uid

  # Prometheus 告警数据源
  - name: Prometheus-Alerting
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: true
    jsonData:
      httpMethod: POST
      manageAlerts: false
      prometheusType: Prometheus
      prometheusVersion: 2.40.0
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger-uid
    version: 1
    uid: prometheus-alerting-uid

  # MySQL 数据源 (可选)
  - name: MySQL
    type: mysql
    access: proxy
    url: mysql:3306
    database: ry-vue
    user: root
    isDefault: false
    editable: true
    jsonData:
      maxOpenConns: 100
      maxIdleConns: 100
      maxIdleConnsAuto: true
      connMaxLifetime: 14400
      queryTimeout: 60s
      sslmode: disable
    secureJsonData:
      password: root
    version: 1
    uid: mysql-uid