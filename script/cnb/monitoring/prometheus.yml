# Prometheus 配置文件
# RuoYi-Vue-Plus 监控系统配置

global:
  # 数据采集间隔
  scrape_interval: 15s
  # 规则评估间隔
  evaluation_interval: 15s
  # 外部标签
  external_labels:
    cluster: 'ruoyi-vue-plus'
    environment: 'production'

# 告警规则文件
rule_files:
  - "alert_rules.yml"

# 告警管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# 数据采集配置
scrape_configs:
  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 5s
    metrics_path: /metrics

  # RuoYi 主应用监控
  - job_name: 'ruoyi-server'
    static_configs:
      - targets: 
        - 'localhost:8080'
        - 'localhost:8081'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true
    params:
      format: ['prometheus']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__address__]
        regex: '(.*):(.*)'
        target_label: server_port
        replacement: '${2}'
      - target_label: application
        replacement: 'ruoyi-server'

  # Spring Boot Admin 监控
  - job_name: 'ruoyi-monitor-admin'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    relabel_configs:
      - target_label: application
        replacement: 'ruoyi-monitor-admin'

  # SnailJob 任务调度监控
  - job_name: 'ruoyi-snailjob'
    static_configs:
      - targets: ['localhost:8800']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 30s
    relabel_configs:
      - target_label: application
        replacement: 'ruoyi-snailjob'

  # MySQL 数据库监控
  - job_name: 'mysql'
    static_configs:
      - targets: ['localhost:9104']
    scrape_interval: 30s
    relabel_configs:
      - target_label: application
        replacement: 'mysql'
    # MySQL Exporter 需要单独部署

  # Redis 监控
  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:9121']
    scrape_interval: 30s
    relabel_configs:
      - target_label: application
        replacement: 'redis'
    # Redis Exporter 需要单独部署

  # MinIO 对象存储监控
  - job_name: 'minio'
    static_configs:
      - targets: ['localhost:9000']
    metrics_path: '/minio/v2/metrics/cluster'
    scrape_interval: 30s
    relabel_configs:
      - target_label: application
        replacement: 'minio'

  # Node Exporter 系统监控
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']
    scrape_interval: 15s
    relabel_configs:
      - target_label: application
        replacement: 'node-exporter'

  # Docker 容器监控
  - job_name: 'docker'
    static_configs:
      - targets: ['localhost:9323']
    scrape_interval: 30s
    relabel_configs:
      - target_label: application
        replacement: 'docker'

  # JVM 监控 (通过 JMX Exporter)
  - job_name: 'jvm-metrics'
    static_configs:
      - targets: 
        - 'localhost:8081'  # 主应用 JMX 端口
        - 'localhost:8082'  # 备用应用 JMX 端口
    metrics_path: '/metrics'
    scrape_interval: 15s
    relabel_configs:
      - target_label: application
        replacement: 'jvm-metrics'

  # 自定义业务指标监控
  - job_name: 'ruoyi-business-metrics'
    static_configs:
      - targets: ['localhost:8080']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 30s
    metric_relabel_configs:
      # 只保留业务相关指标
      - source_labels: [__name__]
        regex: 'ruoyi_.*|business_.*|user_.*|system_.*'
        action: keep
    relabel_configs:
      - target_label: application
        replacement: 'ruoyi-business'

